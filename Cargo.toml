[package]
name = "miasql"
version = "0.1.3"
edition = "2024"
authors = ["Daniel Laible"]
description = "A save, secure and fast sql database"
repository ="https://github.com/daniellaible/miasql.git"

[dependencies]
uuid = { version = "1.24.0", features = ["v4"] }
sqlparser = "=0.62.0"
tokio = { version = "1.53.1", features = ["full"] }
rayon = "1.12.0"
log = "0.4.33"
env_logger = "0.11.11"
anyhow = "1.0.104"

